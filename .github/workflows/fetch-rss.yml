name: Fetch RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch & parse RSS
        run: |
          python3 - <<'PYEOF'
          import urllib.request, xml.etree.ElementTree as ET, json, sys

          RSS_URL = 'https://anchor.fm/s/1129acc30/podcast/rss'
          NS = {
            'itunes': 'http://www.itunes.com/dtds/podcast-1.0.dtd',
            'media':  'http://search.yahoo.com/mrss/',
          }

          req = urllib.request.Request(RSS_URL, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
            xml_bytes = r.read()

          root = ET.fromstring(xml_bytes)
          channel = root.find('channel')

          def txt(el, tag, ns=None):
            found = channel.find(tag) if ns is None else channel.find(tag, ns)
            return found.text.strip() if found is not None and found.text else ''

          img_el = channel.find('itunes:image', NS)
          feed_image = img_el.get('href', '') if img_el is not None else ''
          if not feed_image:
            img_el2 = channel.find('image/url')
            feed_image = img_el2.text.strip() if img_el2 is not None and img_el2.text else ''

          feed = {
            'title':       txt(None, 'title'),
            'description': txt(None, 'description'),
            'image':       feed_image,
            'link':        txt(None, 'link'),
          }

          items = []
          for item in channel.findall('item')[:12]:
            def itxt(tag):
              el = item.find(tag)
              return el.text.strip() if el is not None and el.text else ''
            iimg = item.find('itunes:image', NS)
            thumb = iimg.get('href', '') if iimg is not None else ''
            if not thumb:
              thumb = feed_image
            enc = item.find('enclosure')
            audio_url = enc.get('url', '') if enc is not None else ''
            items.append({
              'title':       itxt('title'),
              'description': itxt('description'),
              'pubDate':     itxt('pubDate'),
              'link':        itxt('link'),
              'thumbnail':   thumb,
              'audioUrl':    audio_url,
            })

          out = {'feed': feed, 'items': items}
          with open('static/feed.json', 'w') as f:
            json.dump(out, f)
          print(f'Wrote {len(items)} episodes to static/feed.json')

          # Resolve latest video embed from YouTube public RSS feed
          import re
          latest_embed_src = 'https://open.spotify.com/embed/show/033gFTqCwsukpXM8B1ruUm?utm_source=generator'
          try:
            yt_rss_req = urllib.request.Request(
              'https://www.youtube.com/feeds/videos.xml?playlist_id=PLIrCbkJzJFud1bNGZwB8-NnLga6fRTm7e',
              headers={'User-Agent': 'Mozilla/5.0'}
            )
            with urllib.request.urlopen(yt_rss_req, timeout=15) as rss_r:
              yt_xml = rss_r.read().decode('utf-8', errors='replace')
            vid_m = re.search(r'<yt:videoId>([A-Za-z0-9_-]+)</yt:videoId>', yt_xml)
            if vid_m:
              yt_video_id = vid_m.group(1)
              latest_embed_src = f'https://www.youtube.com/embed/{yt_video_id}?rel=0'
              print(f'Using YouTube embed: {yt_video_id}')
            else:
              print('No video ID in YouTube RSS, using Spotify show embed')
          except Exception as e:
            print(f'YouTube lookup failed ({e}), using Spotify show embed')

          # Inject PodcastEpisode schema blocks into index.html
          from email.utils import parsedate_to_datetime

          def iso_date(pub_date):
            try:
              return parsedate_to_datetime(pub_date).strftime('%Y-%m-%d')
            except Exception:
              return pub_date

          def strip_html(text):
            return re.sub(r'<[^>]+>', '', text).strip()

          schema_tags = []
          for ep in items:
            desc = strip_html(ep.get('description', ''))
            if len(desc) > 500:
              desc = desc[:497] + '...'
            schema = {
              '@context': 'https://schema.org',
              '@type': 'PodcastEpisode',
              'url': ep.get('link', ''),
              'name': ep.get('title', ''),
              'datePublished': iso_date(ep.get('pubDate', '')),
              'description': desc,
              'image': ep.get('thumbnail', ''),
              'partOfSeries': {
                '@type': 'PodcastSeries',
                'name': 'Pixel Broccoli',
                'url': 'https://pixelbroccoli.com',
              },
            }
            if ep.get('audioUrl'):
              schema['associatedMedia'] = {
                '@type': 'AudioObject',
                'contentUrl': ep['audioUrl'],
                'encodingFormat': 'audio/mpeg',
              }
            schema_tags.append(
              f'  <script type="application/ld+json">\n  {json.dumps(schema, ensure_ascii=False, indent=2)}\n  </script>'
            )

          schema_block = '\n'.join(schema_tags)

          with open('index.html', 'r', encoding='utf-8') as f:
            html = f.read()

          html = re.sub(
            r'<!-- EPISODE_SCHEMA_START -->.*?<!-- EPISODE_SCHEMA_END -->',
            f'<!-- EPISODE_SCHEMA_START -->\n{schema_block}\n  <!-- EPISODE_SCHEMA_END -->',
            html,
            flags=re.DOTALL,
          )

          html = re.sub(
            r'(id="latest-ep-iframe"[\s\S]*?src=")[^"]*(")',
            rf'\g<1>{latest_embed_src}\g<2>',
            html,
          )

          with open('index.html', 'w', encoding='utf-8') as f:
            f.write(html)

          print(f'Injected {len(schema_tags)} PodcastEpisode schema blocks into index.html')

          # Regenerate llms.txt from current feed
          episodes_llms = []
          for ep in items:
            title = ep.get('title', '')
            desc = strip_html(ep.get('description', ''))
            if len(desc) > 600:
              desc = desc[:597] + '...'
            try:
              dt = parsedate_to_datetime(ep.get('pubDate', ''))
              date_str = dt.strftime('%B %d, %Y')
            except Exception:
              date_str = ep.get('pubDate', '')
            link = ep.get('link', '')
            episodes_llms.append(
              f'### {title}\nPublished: {date_str}\n{desc}\nListen: {link}'
            )

          episodes_block = '\n\n'.join(episodes_llms)

          llms_lines = [
            '# Pixel Broccoli', '',
            '> Pixel Broccoli is a weekly tech, design, and AI podcast hosted by Zach Manring'
            ' and Evan Cannarozzi, with Brocc — an AI co-host — as a permanent third voice'
            ' in every conversation.', '',
            '## About the Show', '',
            'Pixel Broccoli covers artificial intelligence, web design, software development,'
            ' and the intersection of technology and internet culture. Each episode unpacks'
            ' what AI is actually doing to the world: the hype, the reality, and the topics'
            ' that rarely get discussed openly. The show launched in May 2026 and releases'
            ' new episodes weekly.', '',
            'What makes Pixel Broccoli distinct is Brocc, an AI co-host who participates in'
            ' every episode as a research assistant, devil\'s advocate, and resident'
            ' hot-take generator. Brocc does not just comment on AI — Brocc is AI, in the room.', '',
            '## Hosts', '',
            '**Zach Manring** — Co-host and creator. Zach drives the show\'s vision and brings'
            ' obsessive attention to detail in both content and production.', '',
            '**Evan Cannarozzi** — Co-host and creator. Evan brings structure and balance to'
            ' conversations that frequently go off the rails.', '',
            '**Brocc** — AI co-host. Built to join every conversation as a research assistant,'
            ' devil\'s advocate, and resident hot-take generator.', '',
            '## Topics Covered', '',
            '- Artificial intelligence tools, models, and real-world applications',
            '- Web design and front-end development',
            '- Software engineering practices and AI-assisted coding',
            '- Creator economy, build-in-public culture',
            '- AI in media, music, and art',
            '- Tech industry trends and criticism',
            '- Internet culture and the weird corners of the web', '',
            '## Episodes', '',
            episodes_block, '',
            '## Where to Listen', '',
            '- Spotify: https://open.spotify.com/show/033gFTqCwsukpXM8B1ruUm',
            '- Apple Podcasts: https://podcasts.apple.com/us/podcast/pixel-broccoli/id1896833911',
            '- Amazon Music: https://music.amazon.com/podcasts/aa1d3941-da3a-41fb-abab-280c18165c68/pixel-broccoli',
            '- iHeartRadio: https://iheart.com/podcast/335090441/',
            '- Pocket Casts: https://pca.st/vavyu1m7',
            '- Castbox: https://castbox.fm/channel/Pixel-Broccoli-id7249494',
            '- Goodpods: https://goodpods.com/podcasts/pixel-broccoli-734581',
            '- RSS Feed: https://anchor.fm/s/1129acc30/podcast/rss', '',
            '## Social', '',
            '- X / Twitter: https://x.com/PixelBroccoli',
            '- YouTube: https://www.youtube.com/@PixelBroccoli',
            '- Website: https://pixelbroccoli.com',
            '- Email: pixelbrocolipodcast@gmail.com',
          ]

          with open('llms.txt', 'w', encoding='utf-8') as f:
            f.write('\n'.join(llms_lines) + '\n')

          print(f'Wrote {len(items)} episodes to llms.txt')
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/feed.json index.html llms.txt
          git diff --cached --quiet || git commit -m "chore: refresh RSS feed cache, episode schema, and llms.txt"
          git push
